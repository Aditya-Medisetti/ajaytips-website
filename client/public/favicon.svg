<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .script-ajay { font-family: 'Caveat', cursive, cursive; font-size: 110px; font-weight: 700; fill: #18181B; }
      .script-tips { font-family: 'Caveat', cursive, cursive; font-size: 110px; font-weight: 700; fill: #FFB800; }
      .tagline { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 800; fill: #18181B; letter-spacing: 5px; }
    </style>
  </defs>

  <!-- Pure White Circle Base -->
  <circle cx="256" cy="256" r="246" fill="#FFFFFF" />

  <!-- Thin Yellow Outer Border Ring -->
  <circle cx="256" cy="256" r="242" fill="none" stroke="#FFB800" stroke-width="7" />

  <!-- Ajay Script Text -->
  <text x="142" y="278" text-anchor="middle" className="script-ajay">Ajay</text>

  <!-- Central Lightbulb Group -->
  <g transform="translate(256, 218)">
    <!-- Light Rays -->
    <line x1="0" y1="-56" x2="0" y2="-68" stroke="#FFB800" stroke-width="5" stroke-linecap="round" />
    <line x1="-36" y1="-40" x2="-46" y2="-52" stroke="#FFB800" stroke-width="5" stroke-linecap="round" />
    <line x1="36" y1="-40" x2="46" y2="-52" stroke="#FFB800" stroke-width="5" stroke-linecap="round" />
    <line x1="-52" y1="-12" x2="-64" y2="-16" stroke="#FFB800" stroke-width="5" stroke-linecap="round" />
    <line x1="52" y1="-12" x2="64" y2="-16" stroke="#FFB800" stroke-width="5" stroke-linecap="round" />

    <!-- Yellow Bulb Body -->
    <path d="M 0 -44 
             C -25 -44, -38 -24, -38 -4 
             C -38 12, -22 22, -20 34 
             L 20 34 
             C 22 22, 38 12, 38 -4 
             C 38 -24, 25 -44, 0 -44 Z" 
          fill="#FFB800" />

    <!-- Stylized White "A" inside bulb -->
    <path d="M 0 -28 L -14 6 L -6 6 L 0 -10 L 6 6 L 14 6 Z M -6 -2 L 6 -2 L 0 -14 Z" fill="#FFFFFF" />

    <!-- Screw Base Lines -->
    <line x1="-16" y1="41" x2="16" y2="41" stroke="#18181B" stroke-width="5" stroke-linecap="round" />
    <line x1="-12" y1="48" x2="12" y2="48" stroke="#18181B" stroke-width="5" stroke-linecap="round" />
    <path d="M -7 53 A 7 7 0 0 0 7 53 Z" fill="#18181B" />

    <!-- Base Underline -->
    <line x1="-24" y1="64" x2="24" y2="64" stroke="#18181B" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Tips Script Text -->
  <text x="372" y="278" text-anchor="middle" className="script-tips">Tips</text>

  <!-- Curved Underline Brush Stroke -->
  <path d="M 72 352 Q 256 312 436 324" fill="none" stroke="#18181B" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 230 318 Q 330 316 438 330" fill="none" stroke="#FFB800" stroke-width="4" stroke-linecap="round" />

  <!-- Subtitle Tagline: LEARN • PRACTICE • SUCCEED -->
  <text x="256" y="366" text-anchor="middle" className="tagline">
    LEARN <tspan fill="#FFB800">•</tspan> PRACTICE <tspan fill="#FFB800">•</tspan> SUCCEED
  </text>
</svg>
